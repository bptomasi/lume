name: Check Lume

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2
  # Fresh runners benefit from reusable artifacts, not large incremental state.
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate release tag before qualification
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/publish_release.py --tag "$RELEASE_TAG" --check-tag-only
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Identify compiler cache compatibility
        id: compiler
        run: |
          fingerprint=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo downloads
        id: cargo-downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lume-v2-downloads-ubuntu24.04-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lume-v2-downloads-ubuntu24.04-${{ runner.arch }}-
      - name: Restore compiled Rust artifacts
        id: cargo-build
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target
          key: lume-v2-build-ubuntu24.04-${{ runner.arch }}-${{ steps.compiler.outputs.fingerprint }}-debug0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            lume-v2-build-ubuntu24.04-${{ runner.arch }}-${{ steps.compiler.outputs.fingerprint }}-debug0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config', '.cargo/config.toml') }}-
            lume-v2-build-ubuntu24.04-${{ runner.arch }}-${{ steps.compiler.outputs.fingerprint }}-debug0-
      - name: Restore pinned audit executable
        id: audit-tool
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-audit
          key: lume-v2-audit-ubuntu24.04-${{ runner.arch }}-0.22.2
      - name: Restore Python downloads
        id: python-downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: lume-v2-pip-ubuntu24.04-${{ runner.arch }}-${{ hashFiles('tools/requirements-visual.txt') }}
          restore-keys: |
            lume-v2-pip-ubuntu24.04-${{ runner.arch }}-
      - name: Install SVG text and real Foot qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core xvfb xauth foot weston \
            wayland-utils imagemagick python3-venv
      - name: Install pinned development security and visual tools
        run: |
          if ! cargo-audit --version 2>/dev/null | grep -qx 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          fi
          python3 -m venv /tmp/lume-visual
          /tmp/lume-visual/bin/python -m pip install -r tools/requirements-visual.txt
      - name: Fetch locked Linux dependencies on a download cache miss
        if: steps.cargo-downloads.outputs.cache-hit != 'true'
        run: cargo fetch --locked --target x86_64-unknown-linux-gnu
      # Save downloads/tools before qualification so later failures retain them.
      # Only the default branch writes shared caches; other refs restore them.
      - name: Save Cargo downloads
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-downloads.outputs.cache-primary-key }}
      - name: Save pinned audit executable
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.audit-tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ steps.audit-tool.outputs.cache-primary-key }}
      - name: Save Python downloads
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.python-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: ${{ steps.python-downloads.outputs.cache-primary-key }}
      - name: Qualify local behavior
        run: make check
      - name: Qualify current dependency advisories
        run: make check-security
      - name: Qualify real HTTP
        run: make check-http
      - name: Build the release binary
        run: make build
      - name: Save compiled Rust artifacts before visual qualification
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.cargo-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target
          key: ${{ steps.cargo-build.outputs.cache-primary-key }}
      - name: Qualify Foot through native Wayland with an input seat
        run: |
          xvfb-run -a -s '-screen 0 1920x1440x24' \
            python3 tools/qualify_wayland.py --artifacts /tmp/lume-wayland-ci -- \
            make check-foot PYTHON=/tmp/lume-visual/bin/python \
            FOOT_ARGS="--artifacts /tmp/lume-foot-ci"
      - name: Package the qualified revision
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') }}
        run: make package PACKAGE_ARGS=--require-clean
      - name: Retain package, direct executable and checksums
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lume-linux-x86_64
          path: dist/
          if-no-files-found: error
      - name: Retain terminal qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-and-security-qualification
          path: |
            /tmp/lume-foot-ci
            /tmp/lume-wayland-ci
            reports/advisories.json
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish tagged release
    needs: reader
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out qualified revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download qualified package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lume-linux-x86_64
          path: dist
      - name: Verify and publish package, executable and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/publish_release.py --tag "$RELEASE_TAG" --publish
