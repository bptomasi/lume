name: Check Lume

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Install SVG text and real terminal qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core alacritty xvfb xdotool xclip x11-apps foot weston imagemagick python3-venv
      - name: Install pinned development security and visual tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          python3 -m venv /tmp/lume-visual
          /tmp/lume-visual/bin/python -m pip install -r tools/requirements-visual.txt
      - name: Qualify local behavior
        run: make check
      - name: Qualify current dependency advisories
        run: make check-security
      - name: Qualify real HTTP
        run: make check-http
      - name: Build the release binary
        if: ${{ !cancelled() }}
        run: make build
      - name: Qualify input and cleanup in real Alacritty
        if: ${{ !cancelled() }}
        run: xvfb-run -a make check-alacritty ALACRITTY_ARGS="--artifacts /tmp/lume-alacritty-ci"
      - name: Qualify Foot on native Wayland
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-lume
          weston --backend=headless-backend.so --renderer=pixman \
            --socket=wayland-lume --idle-time=0 > /tmp/lume-weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor"' EXIT
          for attempt in $(seq 1 100); do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              break
            fi
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat /tmp/lume-weston.log
            exit 1
          fi
          make check-foot PYTHON=/tmp/lume-visual/bin/python \
            FOOT_ARGS="--artifacts /tmp/lume-foot-ci"
      - name: Package the qualified revision on manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: make package PACKAGE_ARGS=--require-clean
      - name: Retain standalone package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lume-linux-x86_64
          path: dist/
          if-no-files-found: error
      - name: Retain terminal qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-and-security-qualification
          path: |
            /tmp/lume-alacritty-ci
            /tmp/lume-foot-ci
            /tmp/lume-weston.log
            reports/advisories.json
          if-no-files-found: error
          retention-days: 7
