[package]
name = "lume"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "A quiet place for curious minds. An independent RSS/Atom reader."
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
crossterm = "=0.28.1"
dom_smoothie = { version = "=0.18.2", default-features = false }
dom_query = { version = "=0.28.0", default-features = false }
feed-rs = "=3.0.0"
html5gum = { version = "=0.8.3", default-features = false }
nom = "=8.0.0"
pulldown-cmark = { version = "=0.13.0", default-features = false }
quick-xml = { version = "=0.42.0", features = ["escape-html", "serialize"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
refinery = { version = "=0.8.16", default-features = false, features = ["rusqlite"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
shlex = "=2.0.1"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load"] }
tempfile = "=3.27.0"
textwrap = { version = "=0.16.4", default-features = false, features = ["unicode-width"] }
tui-textarea = { version = "=0.7.0", features = ["search"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "gzip"] }
url = "=2.5.8"

[build-dependencies]
anyhow = "=1.0.104"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load"] }

[[bench]]
name = "reader"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"
missing_errors_doc = "deny"
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
